<header class="app-header" [class.menu-open]="isMenuOpen">
  <div class="brand">
    <div class="logo">UC</div>
    <div class="brand-text">
      <span class="name">UniConnect</span>
      <span class="tagline">Plateforme académique</span>
    </div>
  </div>

  <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Menu" *ngIf="!isTeacherRoute">
    <span></span><span></span><span></span>
  </button>

  <nav class="nav-links" *ngIf="!isTeacherRoute">
    <a *ngFor="let item of navItems" [routerLink]="item.path" routerLinkActive="active" (click)="closeMenu()">
      <span class="nav-icon">{{ item.icon }}</span>
      {{ item.label }}
    </a>
  </nav>

  <div class="actions">
    <div class="user-chip">
      <div class="avatar">{{ avatarLetter }}</div>
      <div class="meta">
        <span class="email">{{ userEmail }}</span>
        <span class="role-tag">{{ userRole }}</span>
      </div>
    </div>
    <a class="help-btn" routerLink="/support" title="Aide & Support">?</a>
    <button class="logout-btn" type="button" (click)="logout()">Déconnexion</button>
  </div>
</header>

<div class="mobile-overlay" *ngIf="isMenuOpen && !isTeacherRoute" (click)="closeMenu()"></div>
<div class="mobile-panel" *ngIf="isMenuOpen && !isTeacherRoute">
  <div class="mobile-user">
    <div class="avatar lg">{{ avatarLetter }}</div>
    <div class="meta">
      <span class="email">{{ userEmail }}</span>
      <span class="role-tag">{{ userRole }}</span>
    </div>
  </div>
  <nav class="mobile-nav">
    <a *ngFor="let item of navItems" [routerLink]="item.path" routerLinkActive="active" (click)="closeMenu()">
      <span class="nav-icon">{{ item.icon }}</span>
      {{ item.label }}
    </a>
  </nav>
  <div class="mobile-actions">
    <a routerLink="/support" (click)="closeMenu()">Aide & Support</a>
    <button type="button" (click)="logout()">Déconnexion</button>
  </div>
</div>
