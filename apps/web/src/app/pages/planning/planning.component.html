<div class="page">
  <div class="header">
    <div>
      <h1>Planning</h1>
      <p class="subtitle">Création des séances et gestion des salles.</p>
    </div>
    <button class="ghost" (click)="refresh()">Rafraîchir</button>
  </div>

  <section class="grid">
    <div class="card">
      <h2>Salles</h2>
      <form [formGroup]="roomForm" (ngSubmit)="createRoom()">
        <input formControlName="name" placeholder="Nom (ex: Salle A1)" />
        <input type="number" formControlName="capacity" placeholder="Capacité" />
        <input formControlName="location" placeholder="Localisation (optionnel)" />
        <button type="submit">Ajouter</button>
      </form>
      <ul>
        <li *ngFor="let r of (rooms$ | async)">
          {{ r.name }} — {{ r.capacity }}
          <span class="muted" *ngIf="r.location">({{ r.location }})</span>
          <button type="button" class="ghost" (click)="selectRoomForEdit(r)">Éditer</button>
          <button type="button" class="ghost" (click)="deleteRoom(r._id)">Supprimer</button>
        </li>
      </ul>

      <div class="edit-card" *ngIf="editingRoomId">
        <h3>Modifier salle</h3>
        <form [formGroup]="editRoomForm" (ngSubmit)="saveRoomEdit()">
          <input formControlName="name" placeholder="Nom (ex: Salle A1)" />
          <input type="number" formControlName="capacity" placeholder="Capacité" />
          <input formControlName="location" placeholder="Localisation (optionnel)" />
          <div class="row">
            <button type="submit">Enregistrer</button>
            <button type="button" class="ghost" (click)="cancelEditRoom()">Annuler</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card full">
      <h2>Séances</h2>
      <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="filter">
        <input type="date" formControlName="dateFrom" />
        <input type="date" formControlName="dateTo" />
        <select formControlName="groupId">
          <option value="">Tous les groupes</option>
          <option *ngFor="let g of (groups$ | async)?.items" [value]="g._id">
            {{ g.name }}
          </option>
        </select>
        <select formControlName="teacherId">
          <option value="">Tous les enseignants</option>
          <option *ngFor="let t of (teachers$ | async)" [value]="t.id">
            {{ t.email }} ({{ t.role }})
          </option>
        </select>
        <select formControlName="roomId">
          <option value="">Toutes les salles</option>
          <option *ngFor="let r of (rooms$ | async)" [value]="r._id">
            {{ r.name }}
          </option>
        </select>
        <div class="row">
          <button type="submit">Filtrer</button>
          <button type="button" class="ghost" (click)="resetFilters()">Réinitialiser</button>
        </div>
      </form>
      <form [formGroup]="sessionForm" (ngSubmit)="createSession()">
        <input type="date" formControlName="date" />
        <div class="row">
          <input type="time" formControlName="startTime" />
          <input type="time" formControlName="endTime" />
        </div>
        <select formControlName="groupId">
          <option value="">Choisir groupe</option>
          <option *ngFor="let g of (groups$ | async)?.items" [value]="g._id">
            {{ g.name }}
          </option>
        </select>
        <select formControlName="teacherId">
          <option value="">Choisir enseignant</option>
          <option *ngFor="let t of (teachers$ | async)" [value]="t.id">
            {{ t.email }} ({{ t.role }})
          </option>
        </select>
        <select formControlName="roomId">
          <option value="">Choisir salle</option>
          <option *ngFor="let r of (rooms$ | async)" [value]="r._id">
            {{ r.name }}
          </option>
        </select>
        <input formControlName="label" placeholder="Libellé (optionnel)" />
        <button type="submit">Créer</button>
      </form>
      <ul>
        <li *ngFor="let s of (sessions$ | async)">
          {{ s.date | date }} — {{ s.startTime }}-{{ s.endTime }}
          <span class="muted">({{ s.label || 'Séance' }})</span>
          <button type="button" class="ghost" (click)="deleteSession(s._id)">Supprimer</button>
        </li>
      </ul>
    </div>
  </section>
</div>
