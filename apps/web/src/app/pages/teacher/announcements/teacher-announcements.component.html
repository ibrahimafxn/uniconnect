<div class="page" [class.compact]="compactMode" [class.ultra-compact]="ultraCompactMode">
  <div class="header">
    <div>
      <h1>Annonces</h1>
      <p class="subtitle">Communications de l'université et informations pédagogiques.</p>
    </div>
    <div class="header-right">
      <label class="toggle"><input type="checkbox" [(ngModel)]="compactMode" (change)="saveCompactMode()" /> Compact</label>
      <label class="toggle"><input type="checkbox" [(ngModel)]="ultraCompactMode" (change)="saveUltraCompactMode()" /> Ultra</label>
    </div>
  </div>

  <!-- Category filter tabs -->
  <div class="cat-tabs">
    <button
      *ngFor="let c of categories"
      class="cat-tab"
      [class.active]="selectedCategory === c.value"
      (click)="filterCategory(c.value)"
    >{{ c.label }}</button>
  </div>

  <ng-container *ngIf="(announcements$ | async) as announcements; else loading">
    <div *ngIf="announcements.length === 0" class="empty">Aucune annonce pour cette catégorie.</div>
    <div class="list">
      <article class="card" *ngFor="let ann of announcements; trackBy: trackById">
        <div class="card-head">
          <div>
            <h2>{{ ann.title }}</h2>
            <p class="muted">{{ formatDate(ann.createdAt) }} • {{ scopeLabel(ann.scope) }}</p>
          </div>
          <span class="badge">{{ categoryLabel(ann.category) }}</span>
        </div>
        <p class="body">{{ ann.body }}</p>
      </article>
    </div>
  </ng-container>

  <ng-template #loading>
    <p class="muted">Chargement des annonces…</p>
  </ng-template>
</div>
