<div class="page">
  <header class="topbar">
    <div class="brand">UniConnect ENT</div>
    <button (click)="logout()">Deconnexion</button>
  </header>

  <main class="content">
    <h1>Tableau de bord</h1>
    <p>Base MVP. Prochaines etapes: inscriptions, planning, messagerie.</p>

    <div class="grid">
      <div class="card">
        <h3>Administration</h3>
        <p>Gestion etudiants, dossiers, paiements.</p>
        <a class="action" routerLink="/admin">Ouvrir</a>
      </div>
      <div class="card">
        <h3>Planning</h3>
        <p>Creation et consultation des EDT.</p>
        <button class="action" disabled title="Module en preparation">Bientot</button>
      </div>
      <div class="card">
        <h3>Messagerie</h3>
        <p>Conversations internes et groupes.</p>
        <button class="action" disabled title="Module en preparation">Bientot</button>
      </div>
      <div class="card">
        <h3>Notes</h3>
        <p>Saisie et consultation des notes.</p>
        <button class="action" disabled title="Module en preparation">Bientot</button>
      </div>
    </div>
  </main>
</div>
